name: Isolated tests
on:
  pull_request:
  push:
    branches: [main, fix/approved-shops-only]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Local tests only; no connected service credentials
        run: env -u SUPABASE_URL -u SUPABASE_SERVICE_ROLE_KEY -u STRIPE_SECRET_KEY -u STRIPE_WEBHOOK_SECRET npm run check
      - run: git diff --exit-code
