<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - ShopMyRepair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-wrap{width:min(940px,100%);margin:0 auto;padding:60px var(--space-page) 72px;display:grid;grid-template-columns:.82fr 1fr;gap:48px;align-items:start}
    .auth-intro p{font-size:18px}
    .auth-card{background:#fff;border:1px solid var(--color-border);border-radius:16px;padding:24px;box-shadow:var(--shadow-soft);display:grid;gap:12px}
    .svc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .svc-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--color-border);border-radius:8px;padding:9px 10px;background:var(--color-surface-soft);font-size:13px;color:var(--color-primary);font-weight:700}
    .svc-pill input{width:auto;min-height:auto}
    .auth-actions{display:flex;gap:10px;flex-wrap:wrap}
    .auth-actions .btn{flex:1}
    @media(max-width:820px){
      .auth-wrap{width:100%;max-width:100%;grid-template-columns:1fr;padding:42px 20px 72px;gap:24px;overflow:hidden}
      .auth-intro{max-width:340px}
      .auth-intro h1{font-size:36px;line-height:1.04;letter-spacing:-.045em}
      .auth-intro p{font-size:16px}
      .auth-card{width:auto;max-width:calc(100vw - 40px);min-width:0;padding:20px;overflow-wrap:anywhere}
      .auth-actions{display:grid;grid-template-columns:1fr}
      .svc-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="/"><span>ShopMy</span><span>Repair</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/pricing.html">Pricing</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <section class="auth-intro">
      <p class="eyebrow">Account access</p>
      <h1>Sign in to manage repairs and quotes.</h1>
      <p>Owners can post repairs and compare quotes. Mechanics and shops can manage profiles, matched jobs, and submitted estimates.</p>
    </section>

    <form class="auth-card" id="authForm">
      <select id="role"><option value="owner">Car Owner</option><option value="mechanic">Individual Mechanic</option><option value="shop">Mechanic Shop</option></select>
      <input id="name" placeholder="Full name (for sign up)" autocomplete="name" />
      <input id="email" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <div id="specialtiesWrap" style="display:none">
        <div class="sub">Required for mechanics and shops: select your specialties.</div>
        <div class="svc-grid" style="margin-top:8px">
          <label class="svc-pill"><input type="checkbox" value="brakes" data-signup-service /> Brakes</label>
          <label class="svc-pill"><input type="checkbox" value="engine" data-signup-service /> Engine</label>
          <label class="svc-pill"><input type="checkbox" value="tire_replacement" data-signup-service /> Tire Replacement</label>
          <label class="svc-pill"><input type="checkbox" value="transmission" data-signup-service /> Transmission</label>
          <label class="svc-pill"><input type="checkbox" value="electrical" data-signup-service /> Electrical</label>
          <label class="svc-pill"><input type="checkbox" value="diagnostics" data-signup-service /> Diagnostics</label>
          <label class="svc-pill"><input type="checkbox" value="suspension" data-signup-service /> Suspension</label>
          <label class="svc-pill"><input type="checkbox" value="ac" data-signup-service /> A/C & Heating</label>
          <label class="svc-pill"><input type="checkbox" value="oil_change" data-signup-service /> Oil Change / Maintenance</label>
          <label class="svc-pill"><input type="checkbox" value="battery" data-signup-service /> Battery/Starter/Alternator</label>
          <label class="svc-pill"><input type="checkbox" value="other" data-signup-service /> Other</label>
        </div>
      </div>
      <div class="auth-actions">
        <button class="btn btn-secondary" id="signInBtn" type="button">Sign In</button>
        <button class="btn btn-primary" id="signUpBtn" type="button">Create Account</button>
      </div>
      <p id="authStatus" class="sub"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
